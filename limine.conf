timeout: 5
serial: yes

# ─────────────────────────────────────────────────────
# akernel boot menu
# Works in QEMU (BIOS/UEFI) and VirtualBox (BIOS/EFI)
# ─────────────────────────────────────────────────────

/akernel 1.2.2 "Caramel"
    protocol: limine
    path: boot():/boot/akernel.elf
    # No kaslr for now – keep kernel at fixed address
    kaslr: no
