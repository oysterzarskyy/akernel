name: Feature request
description: Suggest a focused improvement to the kernel, tooling, or website.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues and explain the use case. This project is an early kernel scaffold, not a complete operating system.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or result you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workaround or alternative you have considered.
    validations:
      required: false
