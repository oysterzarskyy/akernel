name: Bug checker

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]

    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib nasm
      - name: Show tool versions
        run: |
          gcc --version
          nasm -v
      - name: Compile and link
        run: make check-${{ matrix.arch }}

  website:
    name: Check website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: web
      - name: Build website stylesheets
        run: npm run build
        working-directory: web
      - name: Check website links and JavaScript syntax
        run: npm run check
        working-directory: web
