name: Bug checker

on:
  push:
    branches:
      - main
      - nightly
  pull_request:
    branches:
      - main
      - nightly
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily to check for stale issues/PRs

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aash:
    name: Test AASH interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test commands, colors, setup dispatch, and invalid input
        run: make test-aash

  kernel:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]

    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib nasm
      - name: Show tool versions
        run: |
          gcc --version
          nasm -v
      - name: Compile and link
        run: make check-${{ matrix.arch }}

  iso:
    name: Build & smoke-test ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.semver }}
      codename: ${{ steps.ver.outputs.codename }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from version.h
        id: ver
        run: |
          HDR=kernel/include/akernel/version.h
          MAJOR=$(grep 'AKERNEL_VERSION_MAJOR' "$HDR" | grep -oP '\d+')
          MINOR=$(grep 'AKERNEL_VERSION_MINOR' "$HDR" | grep -oP '\d+')
          PATCH=$(grep 'AKERNEL_VERSION_PATCH' "$HDR" | grep -oP '\d+')
          NAME=$(grep 'AKERNEL_VERSION_NAME'   "$HDR" | grep -oP '"[^"]+"' | tr -d '"')
          SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "codename=$NAME" >> "$GITHUB_OUTPUT"
          echo "Kernel version: $SEMVER ($NAME)"

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-multilib nasm curl xorriso file zip unzip qemu-system-x86 ovmf

      - name: Show GCC version
        run: gcc --version

      - name: Build ISO ZIP with GCC (Fresh compile)
        run: make CC=gcc iso-zip

      - name: Locate freshly built artifacts
        id: arts
        run: |
          ISO_FILE=$(find build -maxdepth 1 -name "*.iso" | head -n 1)
          ZIP_FILE=$(find build -maxdepth 1 -name "*.zip" | head -n 1)
          SHA_FILE="${ZIP_FILE}.sha256"
          test -n "$ISO_FILE" && test -s "$ISO_FILE"
          test -n "$ZIP_FILE" && test -s "$ZIP_FILE"
          test -n "$SHA_FILE" && test -s "$SHA_FILE"
          echo "ISO_FILE=$ISO_FILE" >> $GITHUB_ENV
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "SHA_FILE=$SHA_FILE" >> $GITHUB_ENV
          echo "Found: $ISO_FILE | $ZIP_FILE | $SHA_FILE"

      - name: Verify ISO filesystem
        run: file "${{ env.ISO_FILE }}" | grep -q "ISO 9660"

      - name: Verify ZIP and checksum
        run: |
          unzip -t "${{ env.ZIP_FILE }}"
          sha256sum -c "${{ env.SHA_FILE }}"

      - name: Smoke-test BIOS and UEFI boots in QEMU
        shell: bash
        run: |
          set -euo pipefail
          ISO_PATH="${{ env.ISO_FILE }}"
          smoke_boot() {
            name="$1"; shift
            log="build/qemu-${name}.log"
            set +e
            timeout --signal=TERM --kill-after=5s 15s \
              qemu-system-x86_64 -accel tcg -m 2G \
              -cdrom "$ISO_PATH" -boot d \
              -display none -serial none -monitor none \
              -no-reboot -no-shutdown -d guest_errors -D "$log" "$@"
            status="$?"
            set -e
            if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
              echo "QEMU ${name} smoke test exited unexpectedly: ${status}"; exit 1
            fi
            if [ -s "$log" ] && grep -v 'Invalid read at addr 0xFED4' "$log" | grep -q .; then
              cat "$log"; echo "QEMU ${name} smoke test reported guest errors"; exit 1
            fi
          }
          smoke_boot bios
          ovmf_code=""; ovmf_vars=""
          for suffix in "" "_4M"; do
            ccode="/usr/share/OVMF/OVMF_CODE${suffix}.fd"
            cvars="/usr/share/OVMF/OVMF_VARS${suffix}.fd"
            if [ -f "$ccode" ] && [ -f "$cvars" ]; then ovmf_code="$ccode"; ovmf_vars="$cvars"; break; fi
          done
          test -n "$ovmf_code"
          cp "$ovmf_vars" build/OVMF_VARS.fd
          smoke_boot uefi -machine q35 \
            -drive "if=pflash,format=raw,readonly=on,file=${ovmf_code}" \
            -drive "if=pflash,format=raw,file=build/OVMF_VARS.fd"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: akernel-nightly-${{ steps.ver.outputs.semver }}-iso
          path: |
            ${{ env.ISO_FILE }}
            ${{ env.ZIP_FILE }}
            ${{ env.SHA_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/nightly' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: nightly
          name: "akernel ${{ steps.ver.outputs.semver }} (${{ steps.ver.outputs.codename }}) – Nightly"
          files: |
            ${{ env.ISO_FILE }}
            ${{ env.ZIP_FILE }}
            ${{ env.SHA_FILE }}
          prerelease: true
          make_latest: false
          body: |
            🌙 **Automated nightly build**

            | Field | Value |
            |-------|-------|
            | Version | `${{ steps.ver.outputs.semver }}` |
            | Codename | **${{ steps.ver.outputs.codename }}** |
            | Commit | `${{ github.sha }}` |

            Includes compiled ISO, ZIP, and SHA-256 checksum.

            ```bash
            qemu-system-x86_64 -m 2G -cdrom akernel-*.iso -no-reboot
            ```

  website:
    name: Check website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: web
      - name: Build website stylesheets
        run: npm run build
        working-directory: web
      - name: Check website links and JavaScript syntax
        run: npm run check
        working-directory: web

  labeler:
    name: PR Labeler
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  stale:
    name: Manage Stale Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-close: 7
          stale-issue-message: "This issue has been marked as stale because it has been inactive for 30 days. It will be closed in 7 days if no further activity occurs."
          stale-pr-message: "This pull request has been marked as stale because it has been inactive for 14 days. It will be closed in 7 days if no further activity occurs."
          stale-issue-label: "stale"
          stale-pr-label: "stale"